name: Visual Tests

on:
  pull_request:
    branches: [master]

jobs:
  theme:
    name: Theme checks (mui verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm --filter registry verify:theme
      - run: pnpm --filter registry verify:gate

  mui-cli:
    name: mui-cli unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --filter @siriwatknp/mui-cli...
      - run: pnpm --filter @siriwatknp/mui-cli test
